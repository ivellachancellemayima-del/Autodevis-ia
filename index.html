<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#153d75"><link rel="manifest" href="manifest.webmanifest"><title>AutoDevis IA</title><style>body{font:16px system-ui;background:#f2f5fa;color:#14243c;margin:0}header{background:#153d75;color:white;padding:20px}main{max-width:850px;margin:auto;padding:20px}.card{background:white;padding:20px;border-radius:14px;margin:16px 0;box-shadow:0 2px 12px #0001}label{display:block;margin:10px 0 4px}input,textarea,select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #b9c6d6;border-radius:8px;font:inherit}button{padding:11px 15px;border:0;border-radius:8px;background:#153d75;color:white;cursor:pointer;margin:5px 5px 5px 0}.danger{background:#a32f37}.row{display:grid;grid-template-columns:2fr 1fr 1fr auto;gap:8px;align-items:end}.row button{margin:0}.muted{color:#566578}#total{font-size:1.5em;font-weight:bold}@media(max-width:600px){.row{grid-template-columns:1fr 1fr}.row label:first-child{grid-column:span 2}}@media print{header,.no-print,#history{display:none!important}body{background:white}.card{box-shadow:none;border:1px solid #ddd}}</style></head><body><header><h1>AutoDevis IA</h1><div>Devis professionnels, simplement</div></header><main><section class="card"><h2>Nouveau devis</h2><label>Votre entreprise<input id="company" placeholder="Nom de l'entreprise"></label><label>Adresse et coordonnées de l'entreprise<textarea id="companyDetails" rows="2"></textarea></label><label>Nom du client<input id="client" required></label><label>Adresse du client<textarea id="clientDetails" rows="2"></textarea></label><label>Numéro de devis<input id="number"></label><label>Date<input id="date" type="date"></label><label>Validité (jours)<input id="validity" type="number" min="1" value="30"></label><h3>Prestations</h3><div id="items"></div><button class="no-print" id="add" type="button">+ Ajouter une ligne</button><label>TVA applicable (%)<input id="vat" type="number" min="0" max="100" step="0.1" value="20"></label><p class="muted">Choisissez le taux adapté à votre situation. Le taux proposé n'est pas un conseil fiscal.</p><p id="totals" aria-live="polite"></p><label>Conditions / mentions complémentaires<textarea id="notes" rows="3" placeholder="Conditions de règlement, mentions obligatoires adaptées à votre activité..."></textarea></label><div class="no-print"><button id="save">Enregistrer le devis</button><button id="print">Imprimer / PDF</button><button id="new">Nouveau</button></div></section><section class="card no-print" id="history"><h2>Devis enregistrés</h2><div id="saved"></div><p class="muted">Les données restent dans ce navigateur. Faites des sauvegardes : elles ne sont pas synchronisées entre appareils.</p><button id="export">Exporter une sauvegarde JSON</button><label>Importer une sauvegarde JSON<input type="file" id="import" accept="application/json"></label></section></main><script src="app.js"></script></body></html>
